      h += '<div class="panelbtns"><button type="button" class="primary" id="saveItemBtn">これで決定</button>'
        + '<button type="button" id="cancelBtn">やめる</button></div>';
    }
  }else if(sel.kind === "peak"){
    var pk = panelMode==="new" ? null : peakById(sel.id);
    if(panelMode==="view" && pk){
      h += '<h2>⛰ '+esc(pk.title)+'</h2>';
      h += '<div class="meta">'+(pk.amount? '金額: <b>'+esc(pk.amount)+'</b>':'')
        + (pk.due? '　｜　時期: '+esc(pk.due):'')
        + '　｜　小目標 '+stepsOf(pk.id).length+'個</div>';
      if(pk.detail) h += '<div class="detail">'+esc(pk.detail)+'</div>';
      /* 数値の目標。いまの値は編集モードに入らずここで入れ替えられる */
      var pkk2 = kpiOf(pk);
      if(pkk2) h += kpiMarkup(pkk2, true);
      h += kpiSetMarkup(pk);
      h += '<div class="panelbtns noprint">';
      h += '<button type="button" class="'+(pk.done?"":"primary")+'" id="peakDoneBtn">'
        + (pk.done ? "達成を取り消す" : "☀ 達成した！（頂上を光らせる）") + '</button>';
      if(editMode) h += '<button type="button" id="editItemBtn">書き換える</button>' + delButton();
      h += '<button type="button" id="closeBtn">とじる</button></div>';
    }else{
      var v = pk || {title:"",amount:"",due:"",detail:""};
      h += '<h2>'+(panelMode==="new"?"山（中間目標）を追加":"中間目標を書き換える")+'</h2>';
      if(panelMode==="new" && state.peaks.length>=3){
        h += '<p class="hint">※ 大きい目標は3つまでにしておくと、見る人が覚えやすく、図も読みやすくなります。</p>';
      }
      h += '<div class="form">'
        + '<div><label>中間目標の名前（頂上に出ます）</label><input id="f_title" value="'+esc(v.title)+'"></div>'
        + '<div class="frow">'
        + '<div><label>金額（頂上の札に出ます）</label><input id="f_amount" value="'+esc(v.amount)+'" placeholder="300万円 など"></div>'
        + '<div><label>時期</label><input id="f_due" value="'+esc(v.due)+'" placeholder="今年中 など"></div>'
        + '</div>'
        + '<div><label>詳しいメモ</label><textarea id="f_detail">'+esc(v.detail)+'</textarea></div>'
        + '</div>';
      h += '<div class="panelbtns"><button type="button" class="primary" id="saveItemBtn">これで決定</button>'
        + '<button type="button" id="cancelBtn">やめる</button></div>';
    }
  }else if(sel.kind === "goal"){
    if(panelMode==="view"){
      h += '<h2>🚩 ゴール：'+esc(state.goal.title||"")+'</h2>';
      if(state.goal.sub) h += '<div class="meta">'+esc(state.goal.sub)+'</div>';
      if(state.goal.detail) h += '<div class="detail">'+esc(state.goal.detail)+'</div>';
      /* ゴール（KGI）の数値。山と同じ形で入れられるようにする */
      var glk2 = kpiOf(state.goal);
      if(glk2) h += kpiMarkup(glk2, true);
      h += kpiSetMarkup(state.goal);
      h += '<div class="panelbtns noprint">';
      h += '<button type="button" class="'+(state.goal.done?"":"primary")+'" id="goalDoneBtn">'
        + (state.goal.done ? "達成を取り消す" : "🎉 登頂した！") + '</button>';
      if(editMode) h += '<button type="button" id="editItemBtn">書き換える</button>';
      h += '<button type="button" id="closeBtn">とじる</button></div>';
    }else{
      var v = state.goal;
      h += '<h2>ゴールを書き換える</h2>';
      h += '<div class="form">'
        + '<div><label>ゴール（丸の中の大きい文字）</label><input id="f_title" value="'+esc(v.title)+'"></div>'
        + '<div><label>そえがき（丸の中の小さい文字）</label><input id="f_sub" value="'+esc(v.sub)+'"></div>'
        + '<div><label>詳しいメモ</label><textarea id="f_detail">'+esc(v.detail)+'</textarea></div>'
        + '<div><label>いちばん下に出す注意書き（紙にも出ます）</label>'
        + '<textarea id="f_note">'+esc(state.note||"")+'</textarea></div>'
        + '</div>';
      h += '<div class="panelbtns"><button type="button" class="primary" id="saveItemBtn">これで決定</button>'
        + '<button type="button" id="cancelBtn">やめる</button></div>';
    }
  }
  p.innerHTML = h;
  bindPanel();
}
function bindPanel(){
  var b;
  /* とじる・やめる は選択そのものを解くので、図とカードの印も一緒に消す。
     renderPanel だけだと、選んだ枠が残って「まだ選ばれている」ように見える */
  if(b = $("closeBtn")) b.addEventListener("click", function(){ sel=null; panelMode="view"; render(); });
  if(b = $("cancelBtn")) b.addEventListener("click", function(){
    if(panelMode==="new"){ sel=null; }
    panelMode="view"; render();
  });
  if(b = $("editItemBtn")) b.addEventListener("click", function(){ panelMode="edit"; renderPanel(); });
  /* 期日をその場で入れ替える。押し間違いは「取り消す」で戻せる */
  if(b = $("q_dueon")) b.addEventListener("change", function(){
    var st = stepById(sel.id); if(!st) return;
    var v = this.value;
    if((st.dueOn || "") === v) return;
    var snap = JSON.stringify(state);
    setDueOn(st, v); commit();
    offerUndo(st.dueOn ? "期日を " + st.dueOn + " にしました" : "期日を消しました", snap);
  });
  if(b = $("q_dueclear")) b.addEventListener("click", function(){
    var st = stepById(sel.id); if(!st || !st.dueOn) return;
    var snap = JSON.stringify(state);
    setDueOn(st, ""); commit();
    offerUndo("期日を消しました", snap);
  });
  /* 数値の目標を入れる・入れ替える。押し間違いは「取り消す」で戻せる */
  function kpiTarget(){
    if(!sel) return null;
    if(sel.kind === "goal") return state.goal;
    if(sel.kind === "peak") return peakById(sel.id);
    return null;
  }
  /* 打つそばから結果を出す。欄を開いた直後にも1回出しておく */
  if(b = $("q_kpiprev")){
    kpiPreview();
    var box = b.parentNode;
    box.addEventListener("input", kpiPreview);
  }
  if(b = $("q_kpisave")) b.addEventListener("click", function(){
    var o = kpiTarget(); if(!o) return;
    var tgt = $("q_kpitgt").value;
    if(toNum(tgt) === null || toNum(tgt) <= 0){
      toast("「目標の数」を入れてください", true); $("q_kpitgt").focus(); return;
    }
    var snap = JSON.stringify(state);
    setKpi(o, $("q_kpilabel").value, $("q_kpicur").value, tgt, $("q_kpiunit").value);
    commit();
    var k = kpiOf(o);
    offerUndo(k ? "数値の目標を " + kpiText(k) + "（" + k.pct + "%）にしました" : "数値の目標を外しました", snap);
  });
  if(b = $("q_kpiclear")) b.addEventListener("click", function(){
    var o = kpiTarget(); if(!o || !o.kpi) return;
    var snap = JSON.stringify(state);
    delete o.kpi; commit();
    offerUndo("数値の目標を外しました", snap);
  });
  /* タスク：押して済み⇔未済、編集モードで消す、下の欄で追加 */
  var tbs = document.querySelectorAll("#panel [data-task]");
  for(var i=0;i<tbs.length;i++){
    tbs[i].addEventListener("click", function(){ toggleTask(this.dataset.task); });
  }
  var tds = document.querySelectorAll("#panel [data-taskdel]");
  for(var i=0;i<tds.length;i++){
    tds[i].addEventListener("click", function(){ deleteTask(this.dataset.taskdel); });
  }
  if(b = $("q_taskin")){
    b.addEventListener("input", function(){ taskDraft = this.value; });
    b.addEventListener("keydown", function(e){
      /* 日本語入力の変換確定の Enter では追加しない（Safari は isComposing を立てず 229 を返す） */
      if(e.key === "Enter" && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); addTask(); }
    });
  }
  if(b = $("q_taskadd")) b.addEventListener("click", addTask);
  if(b = $("q_taskstepdone")) b.addEventListener("click", function(){
    var st = selStep(); if(st) markDone(st.id);
  });
  if(b = $("peakDoneBtn")) b.addEventListener("click", function(){
    var pk = peakById(sel.id); if(!pk) return;
    var snap = JSON.stringify(state);
    pk.done = !pk.done; commit();
    offerUndo("山" + peakNo(pk.id) + "を" + (pk.done ? "達成にしました" : "達成から戻しました"), snap);
  });
  if(b = $("goalDoneBtn")) b.addEventListener("click", function(){
    var snap = JSON.stringify(state);
    state.goal.done = !state.goal.done; commit();
    offerUndo(state.goal.done ? "ゴールに登頂しました" : "登頂を取り消しました", snap);
  });
  if(b = $("delBtn")) b.addEventListener("click", function(){
    if(!this.dataset.armed){
      this.dataset.armed = "1"; this.className = "armed";
      this.textContent = sel.kind==="peak"
        ? "本当に削除する（中の小目標も消えます・もう一度押す）"
        : "本当に削除する（もう一度押す）";
      return;
    }
    var snap = JSON.stringify(state);
    if(sel.kind==="step"){
      state.steps = state.steps.filter(function(x){ return x.id!==sel.id; });
    }else if(sel.kind==="peak"){
      state.steps = state.steps.filter(function(x){ return x.peak!==sel.id; });
      state.peaks = state.peaks.filter(function(x){ return x.id!==sel.id; });
    }
    sel = null; panelMode = "view"; commit();
    offerUndo("削除しました", snap);
  });
  if(b = $("saveItemBtn")) b.addEventListener("click", function(){
    var title = ($("f_title")||{}).value || "";
    title = title.trim();
    if(!title){ toast("名前を入れてください", true); return; }
    if(sel.kind==="step"){
      var chipEl = document.querySelector('.chip.active[data-chipname="form"]');
      var stv = chipEl ? chipEl.dataset.chip : "todo";
      if(panelMode==="new"){
        var it = { id:newId("s"), peak:sel.peak, title:title,
          owner:$("f_owner").value.trim(), due:$("f_due").value.trim(),
          status:"todo", detail:$("f_detail").value.trim() };
        setDueOn(it, $("f_dueon").value);
        setStatus(it, stv);
        state.steps.push(it);
        sel = {kind:"step", id:it.id};
      }else{
        var it = stepById(sel.id); if(!it) return;
        it.title = title; it.owner = $("f_owner").value.trim();
        it.due = $("f_due").value.trim(); it.detail = $("f_detail").value.trim();
        setDueOn(it, $("f_dueon").value);
        setStatus(it, stv);
      }
    }else if(sel.kind==="peak"){
      if(panelMode==="new"){
        var pk = { id:newId("p"), title:title, amount:$("f_amount").value.trim(),
          due:$("f_due").value.trim(), detail:$("f_detail").value.trim(), done:false };
        state.peaks.push(pk);
        sel = {kind:"peak", id:pk.id};
      }else{
        var pk = peakById(sel.id); if(!pk) return;
        pk.title = title; pk.amount = $("f_amount").value.trim();
        pk.due = $("f_due").value.trim(); pk.detail = $("f_detail").value.trim();
      }
    }else if(sel.kind==="goal"){
      state.goal.title = title;
      state.goal.sub = $("f_sub").value.trim();
      state.goal.detail = $("f_detail").value.trim();
      state.note = $("f_note").value.trim();
    }
    panelMode = "view"; commit();
  });
  var chips = document.querySelectorAll(".chip");
  for(var i=0;i<chips.length;i++){
    chips[i].addEventListener("click", function(){
      var name = this.dataset.chipname;
      if(name === "status"){
        var st = stepById(sel.id); if(!st || st.status === this.dataset.chip) return;
        var snap = JSON.stringify(state);
        setStatus(st, this.dataset.chip); commit();
        offerUndo("「" + st.title + "」を「" + this.textContent + "」にしました", snap);
      }else{
        var all = document.querySelectorAll('.chip[data-chipname="form"]');
        for(var j=0;j<all.length;j++) all[j].classList.remove("active");
        this.classList.add("active");
      }
    });
  }
}

/* ---------- チャートのクリック ---------- */
function openFrom(elm){
  var v = elm.dataset.open.split(":");
  taskDraft = "";   /* 別の小目標を開いたら、打ちかけのタスク名は持ち越さない */
  if(v[0]==="add"){
    sel = {kind:"step", id:null, peak:v[1]}; panelMode = "new";
    quickAdd = ""; qaDraft = "";
  }else{
    sel = {kind:v[0], id:v[1]}; panelMode = "view";
  }
  render();   /* 図とカードの両方で、選んだところに枠が付く */
  $("panel").scrollIntoView({behavior:"smooth", block:"nearest"});
}
/* 開かずにその場で済ませる操作（できた・達成・畳む・一覧・その場で追加）。
   処理したら true を返し、下の「開く」には進まない */
function onAction(e){
  if(!e.target.closest) return false;
  var b;
  if(b = e.target.closest("[data-cycle]")){ cycleStatus(b.dataset.cycle, false); return true; }
  if(b = e.target.closest("[data-done]")){ markDone(b.dataset.done); return true; }
  if(b = e.target.closest("[data-peakdone]")){ achievePeak(b.dataset.peakdone); return true; }
  if(b = e.target.closest("[data-fold]")){
    expanded[b.dataset.fold] = !expanded[b.dataset.fold]; render(); return true;
  }
  if(b = e.target.closest("[data-tally]")){
    tallyOpen = tallyOpen === b.dataset.tally ? "" : b.dataset.tally; render(); return true;
  }
  if(b = e.target.closest("[data-qa]")){
    quickAdd = b.dataset.qa; qaDraft = ""; render(); focusQa(); return true;
  }
  if(e.target.closest(".qaok")){ submitQa(); return true; }
  if(e.target.closest(".qacancel")){ quickAdd = ""; qaDraft = ""; render(); return true; }
  return false;
}
function markDone(id){
  var st = stepById(id); if(!st || st.status === "done") return;
  var snap = JSON.stringify(state);
  setStatus(st, "done"); commit();
  offerUndo("「" + st.title + "」をできたにしました", snap);
}
function achievePeak(id){
  var pk = peakById(id); if(!pk || pk.done) return;
  var snap = JSON.stringify(state);
  pk.done = true; commit();
  offerUndo("山" + peakNo(id) + "「" + pk.title + "」を達成にしました", snap);
}
function focusQa(){
  var i = document.querySelector(".qainput");
  if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}
function submitQa(){
  var i = document.querySelector(".qainput");
  var name = (i ? i.value : "").trim();
  if(!name){ toast("名前を入れてください", true); focusQa(); return; }
  if(!peakById(quickAdd)){ quickAdd = ""; render(); return; }
  var snap = JSON.stringify(state);
  state.steps.push({ id:newId("s"), peak:quickAdd, title:name, owner:"", due:"",
                     status:"todo", detail:"" });
  qaDraft = "";
  commit();
  focusQa();   /* 続けて足せるように入力欄を開いたままにする */
  offerUndo("「" + name + "」を追加しました", snap);
}

/* 取り消す。操作の直前の state を丸ごと控えておき、押されたら戻す。
   控えるのは直前の1回分だけ（数秒で消える） */
var undoSnap = null, undoTimer = null;
function offerUndo(msg, snap){
  undoSnap = snap;
  var u = $("undo");
  u.innerHTML = '<span class="umsg">' + esc(msg) + '</span>'
    + '<button type="button" id="undoBtn">取り消す</button>';
  u.className = "undobar noprint show";
  $("undoBtn").addEventListener("click", undoLast);
  clearTimeout(undoTimer);
  undoTimer = setTimeout(hideUndo, 7000);
}
function hideUndo(){
  clearTimeout(undoTimer);
  undoSnap = null;
  var u = $("undo");
  u.className = "undobar noprint";
  u.innerHTML = "";
}
function undoLast(){
  if(!undoSnap) return;
  state = JSON.parse(undoSnap);
  /* 戻した結果、選んでいた項目が消えていたら選択を解く
     （解かないと、無い項目のパネルが空の入力欄として出る） */
  if(sel && sel.id && ((sel.kind==="step" && !stepById(sel.id)) ||
                       (sel.kind==="peak" && !peakById(sel.id)))) sel = null;
  panelMode = "view";
  if(quickAdd && !peakById(quickAdd)) quickAdd = "";
  hideUndo();
  commit();
  toast("元に戻しました");
}

function wireOpen(id){
  var host = $(id);
  host.addEventListener("click", function(e){
    if(onAction(e)) return;
    var t = e.target.closest ? e.target.closest("[data-open]") : null;
    if(t) openFrom(t);
  });
  host.addEventListener("keydown", function(e){
    /* 追加の入力欄：Enterで追加、Escでやめる */
    if(e.target.classList && e.target.classList.contains("qainput")){
      /* 日本語入力の変換確定のEnterでは追加しない（Safariは isComposing を立てず 229 を返す） */
      if(e.key === "Enter" && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); submitQa(); }
      else if(e.key === "Escape"){ quickAdd = ""; qaDraft = ""; render(); }
      return;
    }
    if(e.key!=="Enter" && e.key!==" ") return;
    var cy = e.target.closest ? e.target.closest("[data-cycle]") : null;
    if(cy){ e.preventDefault(); cycleStatus(cy.dataset.cycle, true); return; }
    var t = e.target.closest ? e.target.closest("[data-open]") : null;
    if(t){ e.preventDefault(); openFrom(t); }
  });
  host.addEventListener("input", function(e){
    if(e.target.classList && e.target.classList.contains("qainput")) qaDraft = e.target.value;
  });
}
/* 印刷の版組み中は再描画しない。印刷時にブラウザが紙の幅でメディア判定を
   発火させ、その途中で render() がDOMを描き直すと、版組みが壊れて
   チェックリストが紙から丸ごと消える（PDF実物で確認した実害） */
var printing = false;
window.addEventListener("beforeprint", function(){ printing = true; });
window.addEventListener("afterprint", function(){ printing = false; render(); });
function onNarrowChange(){ if(!printing) render(); }
if(narrowMQ.addEventListener){ narrowMQ.addEventListener("change", onNarrowChange); }
else if(narrowMQ.addListener){ narrowMQ.addListener(onNarrowChange); }
wireOpen("chart");
wireOpen("cards");
wireOpen("nextbar");
wireOpen("now");
$("ownerbar").addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest("[data-owner]") : null;
  if(!b) return;
  ownerFilter = b.dataset.owner || "";
  saveOwnerFilter(ownerFilter);   /* 次に開いたときも同じしぼり込みで始まる（この端末だけ） */
  render();

/* ---------- 保存（このページ自身を publish しなおす） ---------- */
var saveTimer = null, saving = false, dirty = false;
function commit(){
  state.updated = today();
  render();
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 600);
}
function buildDoc(){
  if(!DATA_EL || !BODY_PARTS.length) return null;
  var json = JSON.stringify(state, null, 1).replace(/</g, "\\u003c");
  var body = "";
  for(var i = 0; i < BODY_PARTS.length; i++){
    body += (BODY_PARTS[i] === null
      ? '<script data-app id="rm-data" type="application/json">\n' + json + "\n<\/script>"
      : BODY_PARTS[i]) + "\n";
  }
  return '<!doctype html>\n<html lang="ja"><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + "<title>" + esc(state.title || "登頂ロードマップ") + "<\/title>\n" + HEAD_HTML
    + "</head><body>\n" + body + "</body></html>";
}
function flush(){
  if(saving || !dirty) return;
  if(LOCAL){ saveLocal(); return; }
  if(!artifactApi){
    dirty = false;
    toast("この画面では保存できません（変更はこの画面かぎりです）", true);
    return;
  }
  var doc = buildDoc();
  if(!doc){ toast("保存の準備に失敗しました。ページを開きなおしてください", true); return; }
  saving = true; dirty = false;
  toast("保存しています…");
  artifactApi.publish(doc).then(function(){
    saving = false; canSave = true;
    toast("保存しました");
    if(dirty) setTimeout(flush, 200);
  }).catch(function(err){
    saving = false;
    var code = (err && err.code) || "";
    if(code === "conflict"){
      toast("ほかの人が先に保存しました。新しい内容を読み込みます");
    }else if(code === "not_granted" || code === "not_writer" || code === "not_declared"){
      canSave = false;
      var bn = $("banner");
      bn.textContent = "このページは見るだけの状態です。変更はほかの人には保存されません。";
      bn.className = "banner show";
      toast("このページは見るだけの状態です", true);
    }else{
      dirty = true;
      toast("保存できませんでした。もう一度おためしください", true);
    }
  });
}
/* 公開版の保存。この端末のブラウザに置く */
function saveLocal(){
  dirty = false;
  try{
    window.localStorage.setItem(STATE_KEY, JSON.stringify(state));
    toast("この端末に保存しました");
  }catch(e){
    localBroken = true; showLocalBanner();
    toast("この端末に保存できませんでした。「ファイルに書き出す」で控えを取ってください", true);
  }
}
function showLocalBanner(){
  var bn = $("banner");
  bn.textContent = "このブラウザには保存できない設定です（プライベート表示など）。閉じる前に「ファイルに書き出す」で控えを取ってください。";
  bn.className = "banner show";
}
/* 書き出す。ファイル名は「題名_日付.json」 */
function safeName(s){ return String(s || "登頂ロードマップ").replace(/[\\/:*?"<>|]/g, "_").slice(0, 60); }
function downloadBlob(name, text, type){
  var url = URL.createObjectURL(new Blob([text], { type:type }));
  var a = document.createElement("a");
  a.href = url; a.download = name; a.style.display = "none";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function exportFile(){
  var name = safeName(state.title) + "_" + today() + ".json";
  downloadBlob(name, JSON.stringify(state, null, 1), "application/json");
  toast("「" + name + "」を書き出しました");
}
/* 読み込む。いまの中身は置きかわるが、7秒の「取り消す」で戻せる */
function importFile(file){
  if(!file) return;
  if(file.size > 3000000){ toast("ファイルが大きすぎます（このページで書き出したファイルを選んでください）", true); return; }
  var fr = new FileReader();
  fr.onload = function(){
    var s = null;
    try{ s = normState(JSON.parse(String(fr.result || ""))); }catch(e){ s = null; }
    if(!s){ toast("このファイルは読み込めません。このページの「ファイルに書き出す」で作ったファイルを選んでください", true); return; }
    var snap = JSON.stringify(state);
    state = s; sel = null; panelMode = "view"; quickAdd = ""; qaDraft = ""; taskDraft = ""; tallyOpen = "";
    if(ownerFilter && allOwners().indexOf(ownerFilter) < 0){ ownerFilter = ""; saveOwnerFilter(""); }
    commit();
    offerUndo("「" + file.name + "」を読み込みました", snap);
  };
  fr.onerror = function(){ toast("ファイルを読めませんでした。もう一度選んでください", true); };
  fr.readAsText(file);
}
/* 白紙の形。山は3つ（決めごと「大きい目標は3つまで」）、小目標はまだ無い */
function blankState(){
  var pk = [];
  for(var i=1;i<=3;i++) pk.push({ id:"p"+i, title:"中間目標 "+i, amount:"", due:"", detail:"", done:false });
  return { v:1, seq:3, title:"わたしのロードマップ", subtitle:"", updated:today(),
           start:{ label:"いま", sub:"" }, note:"",
           goal:{ title:"ゴール", sub:"", detail:"", done:false }, peaks:pk, steps:[] };
}
var toastTimer = null;
function toast(msg, isErr){
  var t = $("toast");
  t.textContent = msg;
  t.className = "saving show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = "saving" + (isErr ? " err" : ""); }, isErr ? 5200 : 2000);
}

function savePrintFile(){
  if(!downloadsApi && LOCAL){
    downloadBlob(safeName(state.title) + "_印刷用.html", printDoc(), "text/html");
    toast("印刷用ファイルを保存しました。そのファイルを開くと印刷できます");
    return;
  }
  if(!downloadsApi){
    printBlocked = true;
    $("printBtn").textContent = "印刷用ファイルを保存";
    showPrintHelp();
    return;
  }
  toast("印刷用ファイルを用意しています…");
  downloadsApi.save({
    filename: (state.title || "登頂ロードマップ") + "_印刷用.html",
    data: printDoc()
  }).then(function(){
    toast("保存しました。そのファイルを開くと印刷できます");
  }).catch(function(err){
    var code = (err && err.code) || "";
    if(code === "declined"){ toast("保存をやめました"); }
    else if(code === "rate_limited"){ toast("少し待ってから、もう一度押してください", true); }
    else { showPrintHelp(); }
  });
}
function showPrintHelp(){
  sel = null; panelMode = "view";
  $("panel").className = "panel";   /* 何も選んでいないと欄ごと隠れているので出す */
  $("panel").innerHTML =
    '<h2>この画面から直接は印刷できません</h2>'
    + '<p class="hint">Artifactの画面は安全のため印刷が止められています（ボタンを押しても何も起きないのはそのためです）。'
    + '紙に貼るときは、次のどちらかでお願いします。</p>'
    + '<div class="form" style="gap:6px;margin-top:8px">'
    + '<p class="hint">1. このページを別のタブで開いてから、キーボードの Ctrl+P（Macは ⌘+P）を押す</p>'
    + '<p class="hint">2. 下のボタンで印刷用ファイルを保存し、そのファイルを開いて印刷する</p></div>'
    + '<div class="panelbtns noprint"><button type="button" class="primary" id="dlBtn">印刷用ファイルを保存する</button>'
    + '<button type="button" id="closeBtn">とじる</button></div>';
  var d = $("dlBtn");
  if(d) d.addEventListener("click", function(){
    if(downloadsApi){ savePrintFile(); }
    else { toast("この画面ではファイルを保存できません。別のタブで開いて Ctrl+P を押してください", true); }
  });
  var c = $("closeBtn");
  if(c) c.addEventListener("click", function(){ renderPanel(); });
  $("panel").scrollIntoView({behavior:"smooth", block:"nearest"});
}
$("printBtn").addEventListener("click", function(){
  if(printBlocked){ savePrintFile(); return; }
  bpFired = false;
  try{ window.print(); }catch(e){}

    if(bpFired) return;               /* ふつうに印刷できた */
    printBlocked = true;
    $("printBtn").textContent = "印刷用ファイルを保存";
    savePrintFile();
  }, 250);
});

   「項目が減った」と誤解されるので、戻したときだけ一度お知らせを出す */
if(LOCAL){
  $("exportBtn").hidden = false; $("importBtn").hidden = false;
  $("localnote").hidden = false; $("blankBtn").hidden = false;
  $("exportBtn").addEventListener("click", exportFile);
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
  $("importFile").addEventListener("change", function(){
    var f = this.files && this.files[0]; this.value = ""; importFile(f);
  });
  $("blankBtn").addEventListener("click", function(){
    /* 消すものが大きいので2回押す（confirm は使わない） */
    if(!this.dataset.armed){
      this.dataset.armed = "1"; this.className = "armed";
      this.textContent = "本当に白紙に戻す（いまの中身は消えます・もう一度押す）";
      return;
    }
    delete this.dataset.armed; this.className = "warn"; this.textContent = "ぜんぶ消して白紙に戻す";
    var snap = JSON.stringify(state);
    state = blankState(); sel = null; panelMode = "view"; quickAdd = ""; tallyOpen = "";
    ownerFilter = ""; saveOwnerFilter("");
    commit();
    offerUndo("白紙にしました", snap);
  });

}

}
